[project]
name = "microglia-repurposing"
version = "0.6.0"
description = "Research-planning drug-signature reversal for Alzheimer's microglia"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
vault = ["networkx>=3", "plotly>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microglia_repurposing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
